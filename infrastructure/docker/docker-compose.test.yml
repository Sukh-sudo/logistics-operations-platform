services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logistics_platform_test
    ports:
      - "${E2E_DATABASE_PORT:-55433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logistics_platform_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 2s
